<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TagLens</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1a1f2b; --muted:#6b7280;
          --line:#e5e7eb; --accent:#2563eb; --accent-ink:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--ink); }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 8px 0 2px; font-size: 1.5rem; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab { padding:8px 14px; border:1px solid var(--line); border-radius:999px;
         background:var(--card); cursor:pointer; color:var(--muted); font-size:.9rem; }
  .tab.active { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=file] { flex:1; min-width:200px; }
  button { padding:10px 18px; border:0; border-radius:10px; background:var(--accent);
           color:var(--accent-ink); font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:16px; margin-top:18px; }
  .label { font-size:.75rem; text-transform:uppercase; letter-spacing:.04em;
           color:var(--muted); margin-bottom:8px; }
  img.preview { max-width:100%; border-radius:8px; display:block; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { font-size:.85rem; padding:4px 10px; border-radius:999px; border:1px solid var(--line); }
  .swatches { display:flex; gap:10px; flex-wrap:wrap; }
  .swatch { display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--muted); }
  .dot { width:18px; height:18px; border-radius:4px; border:1px solid var(--line); }
  table { border-collapse:collapse; width:100%; font-size:.92rem; margin-top:4px; }
  th, td { border:1px solid var(--line); padding:7px 10px; text-align:left; }
  th { background:#f3f4f6; }
  .muted { color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>TagLens</h1>
  <p class="sub">Auto-tag the content of an image or a short video — objects/faces, with analytics.</p>

  <div class="tabs">
    <span class="tab active" data-mode="image">Image</span>
    <span class="tab" data-mode="video">Video</span>
  </div>

  <div class="row">
    <input id="file" type="file" />
    <button id="go">Analyze</button>
  </div>
  <p class="muted" id="hint">Pick an image — people and everyday objects are detected automatically.</p>

  <div id="result"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let mode = "image";

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  mode = t.dataset.mode;
  $("#file").value = "";
  $("#result").innerHTML = "";
  $("#hint").textContent = mode === "image"
    ? "Pick an image — people and everyday objects are detected automatically."
    : "Pick a short video clip (mp4/avi).";
}));

$("#go").addEventListener("click", analyze);

function esc(v){return String(v??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));}

function chips(obj){
  const keys = Object.keys(obj);
  if(!keys.length) return '<span class="muted">none detected</span>';
  return '<div class="chips">'+keys.map(k=>`<span class="chip">${esc(k)}: ${obj[k]}</span>`).join("")+'</div>';
}

async function analyze(){
  const f = $("#file").files[0];
  if(!f){ $("#result").innerHTML = '<p class="muted" style="margin-top:16px">Choose a file first.</p>'; return; }
  const btn = $("#go"); btn.disabled = true; btn.textContent = "…";
  $("#result").innerHTML = '<p class="muted" style="margin-top:16px">Analyzing…</p>';
  const fd = new FormData(); fd.append("file", f);
  try{
    const res = await fetch(`/analyze/${mode}`, { method:"POST", body: fd });
    if(!res.ok){ const e = await res.json().catch(()=>({detail:res.status})); throw new Error(e.detail||res.status); }
    const d = await res.json();
    $("#result").innerHTML = mode === "image" ? renderImage(d) : renderVideo(d);
  }catch(e){
    $("#result").innerHTML = `<div class="card"><div class="label">Error</div><p>${esc(e.message||e)}</p></div>`;
  }finally{ btn.disabled = false; btn.textContent = "Analyze"; }
}

function renderImage(d){
  const colors = (d.dominant_colors||[]).map(c =>
    `<span class="swatch"><span class="dot" style="background:${esc(c.hex)}"></span>${esc(c.hex)} (${(c.proportion*100).toFixed(0)}%)</span>`).join("");
  return `
    ${d.annotated_image ? `<div class="card"><div class="label">Detected (${d.width}×${d.height})</div>
      <img class="preview" src="${d.annotated_image}" /></div>` : ""}
    <div class="card"><div class="label">Tags</div>${chips(d.tag_counts||{})}</div>
    <div class="card"><div class="label">Dominant colours</div><div class="swatches">${colors||'<span class="muted">—</span>'}</div></div>`;
}

function renderVideo(d){
  const st = Object.entries(d.screen_time_sec||{})
    .map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}s</td><td>${(d.tag_counts||{})[k]||0}</td></tr>`).join("");
  const tl = (d.timeline||[]).slice(0,20)
    .map(t=>`<tr><td>${t.time_sec}s</td><td>${t.tags.map(esc).join(", ")}</td></tr>`).join("");
  return `
    <div class="card"><div class="label">Summary</div>
      <p>Duration ${d.duration_sec}s · ${d.fps} fps · ${d.frames_analyzed} frames analyzed</p></div>
    <div class="card"><div class="label">Screen-time by tag</div>
      <table><thead><tr><th>Tag</th><th>Screen-time</th><th>Detections</th></tr></thead>
      <tbody>${st||'<tr><td colspan="3" class="muted">none</td></tr>'}</tbody></table></div>
    <div class="card"><div class="label">Timeline (first 20)</div>
      <table><thead><tr><th>Time</th><th>Tags</th></tr></thead>
      <tbody>${tl||'<tr><td colspan="2" class="muted">none</td></tr>'}</tbody></table></div>`;
}
</script>
</body>
</html>
